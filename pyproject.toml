[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inpiojus-analitic-university"
version = "1.0.0"
description = "Consent-based online-exam proctoring agent + intelligent integrity analyzer for universities. Agente de fiscalização de provas online (com consentimento) + analisador de integridade para universidades."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Joaquim Pedro de Morais Filho", email = "j360074@hotmail.com" },
]
keywords = ["proctoring", "exam", "integrity", "university", "anti-cheating",
            "fiscalizacao", "prova", "integridade", "faculdade", "lgpd"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]
dependencies = ["opencv-python>=4.8", "numpy>=1.23", "pynput>=1.7"]

[project.urls]
Homepage = "https://elevbit-ai.github.io/inpiojus-analitic-university/"
Repository = "https://github.com/elevbit-ai/inpiojus-analitic-university"

[project.scripts]
inpiojus-university = "inpiojus_university.cli:main"

[tool.setuptools]
packages = ["inpiojus_university", "inpiojus_university.monitors"]
